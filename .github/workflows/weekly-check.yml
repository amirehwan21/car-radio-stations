# Every Monday 04:00 MYT (Sunday 20:00 UTC) and on demand: test every stream, repair broken URLs,
# commit v1/stations.json (GitHub Pages serves it to the launcher), and keep one issue
# "Stations needing attention" up to date. checked_at changes every run, so there is always a
# commit, which also keeps GitHub from pausing the schedule after 60 days without activity.
name: Weekly station check

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: station-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check stations
        id: check
        run: |
          set +e
          python3 checker/check.py v1/stations.json --report report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the list
        if: steps.check.outputs.code == '0'
        run: |
          git config user.name "station-check[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/stations.json
          version=$(python3 -c "import json; print(json.load(open('v1/stations.json'))['version'])")
          git commit -m "chore: weekly station check (list v$version)" || exit 0
          git push

      - name: Update the attention issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Stations needing attention"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if grep -qE '^## |Not written' report.md; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file report.md
            else gh issue create --title "$title" --body-file report.md; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All stations pass again."
          fi

      - name: Fail if the run was not written
        if: steps.check.outputs.code != '0'
        run: exit 1
